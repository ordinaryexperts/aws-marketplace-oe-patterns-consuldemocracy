# AWS Marketplace submission configuration
# Used by `make marketplace-validate` / `make marketplace-submit` / `make marketplace-status`
# (via scripts/marketplace.py in the devenv image).

product_id: "prod-paiemurjqun6o"

# Flat per-hour price applied to every instance dimension when running
# scripts/marketplace_reprice.py. Replaces the legacy 67-dimension RateCard.
flat_price: "0.02"
offer_id: "2bffk4xxpe53e21hziby5m40a"

# IAM role that allows AWS Marketplace to read the AMI
ami_access_role_arn: "arn:aws:iam::879777583535:role/AWSMarketplaceAMIScanning"

# Pattern for the CloudFormation parameter that receives the AMI ID.
# {version} is the pattern version with dots stripped (e.g. "2.0.0" -> "200").
ami_parameter_pattern: "AsgAmiIdv{version}"

# S3 bucket and path prefix where CloudFormation templates are published
template_bucket: "ordinary-experts-aws-marketplace-pattern-artifacts"
template_pattern: "consuldemocracy"

# Whether to include a standalone AMI delivery option in addition to the
# CloudFormation delivery option. This product ships as a CloudFormation
# template only.
include_standalone_ami: false

# AMI / OS metadata
operating_system: "UBUNTU"
operating_system_version: "24.04"
username: "ubuntu"
recommended_instance_type: "t3.xlarge"

usage_instructions: >-
  Run the stack, providing valid parameters. When the stack creation completes,
  go to the outputs of the stack and open the URL in your browser. Log in with
  the email address shown in AdminEmailOutput and the password stored under
  the 'admin_password' key in the {StackName}/instance/credentials secret in
  AWS Secrets Manager. To access the application servers, find the EC2
  instance in the AWS console and Connect using the Session Manager option.
  For more detailed instructions, see the GitHub project.

# CloudFormation delivery option details
delivery_option:
  short_description: |
    Deploy a production-ready Consul Democracy citizen-participation site on AWS with this CloudFormation template and custom AMI. Provisions VPC, Auto Scaling Group, Aurora PostgreSQL, S3, SES, and Route53.
  long_description: |
    Consul Democracy on AWS by FOSSonCloud deploys a production-ready Consul Democracy instance using AWS best practices.

    Consul Democracy is the open-source citizen participation platform originally developed by the city of Madrid; it powers proposals, debates, voting and participatory budgeting for governments and civic organizations worldwide.

    WHAT'S DEPLOYED

    - VPC with public and private subnets (or use your existing VPC)
    - Application Load Balancer with ACM certificate for HTTPS
    - Auto Scaling Group with EC2 instances running Consul Democracy (Rails + Puma + nginx)
    - Aurora PostgreSQL cluster (multi-AZ)
    - Memcached on each application instance
    - DelayedJob worker processes for asynchronous tasks
    - S3 bucket with CloudFront for user-uploaded media
    - SES domain identity with Easy DKIM for email delivery
    - Route53 DNS records
    - CloudWatch Logs integration
    - AWS Secrets Manager for credential storage
    - IAM roles with least-privilege permissions

    REQUIREMENTS

    - Route 53 hosted zone for DNS
    - ACM certificate for HTTPS
  architecture_diagram_url: "https://ordinary-experts-aws-marketplace-pattern-artifacts.s3.amazonaws.com/consuldemocracy/2.0.0/diagram.png"

# Used by scripts/marketplace_rebrand.py (utilities 1.9.4+) to submit an
# UpdateInformation change set rebranding the live AWS Marketplace product
# from the legacy "Ordinary Experts CONSUL DEMOCRACY Pattern" wording to the
# FOSSonCloud style.
logo_url: "https://ordinary-experts-aws-marketplace-pattern-artifacts.s3.amazonaws.com/fossoncloud-logo.png"

product_info:
  title: "Consul Democracy on AWS by FOSSonCloud"
  short_description: >-
    Consul Democracy on AWS by FOSSonCloud is a custom AMI + open-source AWS
    CloudFormation template that provisions a production-ready, AWS
    infrastructure solution for deploying Consul Democracy v2.5.0.
  long_description: |
    Consul Democracy on AWS by FOSSonCloud is an open-source AWS
    CloudFormation template that offers an easy-to-install AWS infrastructure
    solution for quickly deploying Consul Democracy, using both AWS and
    Consul Democracy best practices.

    Consul Democracy is the open-source citizen participation platform
    originally developed by the city of Madrid; it powers proposals, debates,
    voting and participatory budgeting for governments and civic organizations
    worldwide.

    Automatically configured to support auto-scaling through AWS Auto Scaling
    Groups, this solution leverages an S3 bucket with CloudFront for user
    generated content between application servers. It configures SES with
    Easy DKIM for emails, and configures Route 53 with convenient DNS entries.

    The template ensures multi-level security by incorporating AWS IAM for
    federated access to resources with least privilege and AWS managed keys
    and Secrets Manager to manage secrets for encryption of data at rest and
    in transit.

    We support multiple availability zones using an RDS Aurora PostgreSQL
    cluster and EC2 Auto Scaling Groups.

    An optional email address is collected as part of the CloudFormation
    parameters as the AdminEmail parameter. This email is used as the initial
    login for the Consul Democracy instance and is not shared with any third
    party.
  highlights:
    - "Production-ready Consul Democracy v2.5.0 site, with search, email, and caching"
    - "Integrated with AWS Certificate Manager for HTTPS support"
    - "Logs in CloudWatch Logs, Remote access via Session Manager"
  categories:
    - "Application Stacks"
    - "Media & Entertainment"
    - "Content Management"
  search_keywords:
    - "consul"
    - "democracy"
    - "social"
    - "voting"
    - "debate"
  resources:
    - name: "FOSSonCloud Product Page"
      url:  "https://fossoncloud.com/products/consuldemocracy"
    - name: "Github Source Code and Documentation"
      url:  "https://github.com/ordinaryexperts/aws-marketplace-oe-patterns-consuldemocracy"
    - name: "Consul Democracy Homepage"
      url:  "https://consuldemocracy.org/"
  support_description: |
    Email support offered with subscription.
    https://fossoncloud.com/products/consuldemocracy
  sku: "OE_PATTERNS_CONSULDEMOCRACY"
